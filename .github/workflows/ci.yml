name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        name: [ubuntu-latest]
    runs-on: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - &setup-xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ matrix.name }}
          build-cache: true
          build-cache-key: ${{ matrix.name }}

      - &package-cache
        name: Cache xmake packages
        uses: actions/cache@v6
        with:
          path: ~/.xmake
          key: xmake-${{ matrix.name }}-${{ hashFiles('xmake.lua', 'third_party/xmake.lua') }}

      - name: Configure
        run: xmake f -y

      - name: Build
        run: xmake -y

  clang-format:
    strategy:
      matrix:
        name: [ubuntu-latest]
    runs-on: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: find src -type f \( -name "*.cpp" -o -name "*.h" \) | xargs clang-format --dry-run --Werror

  clang-tidy:
    needs: build
    strategy:
      matrix:
        name: [ubuntu-latest]
    runs-on: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - *setup-xmake

      - *package-cache

      - name: Generate compile_commands.json
        run: xmake project -k compile_commands .

      - name: Run clang-tidy
        run: |
          LLVMDIR=$(ls -d ~/.xmake/packages/l/llvm-mingw/*/*/)
          printf '%s\n' src/*.cpp | xargs -P "$(nproc)" -I{} \
            clang-tidy-18 -p . --warnings-as-errors='*' \
            --extra-arg=--target=x86_64-w64-mingw32 \
            --extra-arg=-isystem --extra-arg="${LLVMDIR}x86_64-w64-mingw32/include/c++/v1" \
            --extra-arg=-isystem --extra-arg="${LLVMDIR}x86_64-w64-mingw32/include" \
            {}
